services:
  backend:
    build: ./backend
    container_name: ncrtc-backend
    environment:
      PORT: 8100
      DATABASE_PATH: /app/data/ncrtc.db
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-deployment}
    ports:
      - '8100:8100'
    volumes:
      - ncrtc_data:/app/data
    command: npm run dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:8100/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: ncrtc-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_TARGET: http://backend:8100
    ports:
      - '5174:5174'
    command: npm run dev -- --host 0.0.0.0

volumes:
  ncrtc_data:
